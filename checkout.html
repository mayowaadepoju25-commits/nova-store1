
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Nova Store</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="checkout-page">

    <header class="checkout-header">
        <a href="index.html" class="checkout-logo">NOVA STORE</a>
        <span>Secure Checkout</span>
    </header>

    <main class="checkout-container">

        <section class="checkout-form-section">

            <a href="index.html" class="back-link">
                ← Continue Shopping
            </a>

            <h1>Checkout</h1>
            <p>Enter your delivery information below.</p>

            <form id="delivery-form">

                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" required
                    placeholder="Enter your full name">

                <label for="email">Email Address</label>
                <input type="email" id="email" required
                    placeholder="Enter your email">

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required
                    placeholder="Enter your phone number">

                <label for="address">Delivery Address</label>
                <textarea id="address" required
                    placeholder="Enter your full delivery address"></textarea>

                <label for="city">City</label>
                <input type="text" id="city" required
                    placeholder="Enter your city">

                <button type="submit" class="place-order-button">
                    Place Order
                </button>

            </form>

        </section>

        <section class="order-summary-section">

            <h2>Your Order</h2>

            <div id="checkout-products"></div>

            <div class="checkout-total">
                <span>Total</span>
                <strong id="checkout-total">₦0</strong>
            </div>

        </section>

    </main>

    <script src="checkout.js"></script>

</body>
</html>
